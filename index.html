<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora Memoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<style>
/* Layout: pantalla única de stand — barra con marca y navegación entre 3 juegos + ranking + staff; una vista a la vez. Tema nocturno de marca por defecto, tema claro elegible desde Staff. */
:root{
  --bg:#0B1026; --surface:#171E42; --raised:#232B52; --line:#2F3866;
  --text:#F5F7FC; --muted:#B8C0D9; --dim:#848DB0; --input-line:#848DB0;
  --accent:#A884FF; --btn:#7C5CEE; --btn-hover:#6E4FE0;
  --hi:#E5F06F; --lime:#E5F06F; --on-lime:#0B1026;
  --badge-bg:#A884FF; --badge-fg:#0B1026;
  --ok:#E5F06F; --half:#A884FF; --danger:#F29B9B; --danger-line:#5a2d3a;
  --card-face:#171E42; --p1:#A884FF; --p2:#E5F06F;
  --aurora:linear-gradient(90deg,#A884FF,#F5A6D3,#FFD6A8,#BDEFD4,#BFD7FF);
  --score-grad:linear-gradient(90deg,#A884FF,#F5A6D3,#FFD6A8,#BDEFD4,#BFD7FF);
  --f-brand:"Figtree","Inter",system-ui,sans-serif;
  --f-ui:"Inter",system-ui,sans-serif;
  --f-board:"Atkinson Hyperlegible Next","Atkinson Hyperlegible","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-aurora="light"]{
  --bg:#F5F7FC; --surface:#FFFFFF; --raised:#E9EDF7; --line:#D2D9EA;
  --text:#171E42; --muted:#4D5679; --dim:#697298; --input-line:#848DB0;
  --accent:#6E4FE0; --btn:#6E4FE0; --btn-hover:#5638BE;
  --hi:#5638BE; --lime:#E5F06F; --on-lime:#0B1026;
  --badge-bg:#6E4FE0; --badge-fg:#FFFFFF;
  --ok:#1F8A57; --half:#6E4FE0; --danger:#A62828; --danger-line:#F29B9B;
  --card-face:#171E42; --p1:#6E4FE0; --p2:#5F6C14;
  --score-grad:linear-gradient(135deg,#9773FD,#6E4FE0);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 var(--f-ui);transition:background .3s,color .3s}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:0 40px;min-height:100%;display:flex;flex-direction:column}
.band{height:6px;background:var(--aurora)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:20px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.wordmark{font:800 22px/1 var(--f-brand);letter-spacing:.12em}
.tag{font:500 15px/1.2 var(--f-brand);color:var(--muted)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.btn{font:600 15px/1 var(--f-ui);border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);padding:12px 18px;cursor:pointer}
nav button[aria-current="page"]{background:var(--raised);border-color:var(--accent)}
nav button:hover,.btn:hover{border-color:var(--accent)}
nav .ghost{color:var(--muted)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.primary:hover{background:var(--btn-hover)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn.big{font-size:20px;padding:18px 30px}
.btn[aria-pressed="true"]{background:var(--raised);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9773FD;outline-offset:2px}
main{flex:1;display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:28px;flex:1}
h1,h2{font-family:var(--f-brand);text-wrap:balance;margin:0}
h1{font-weight:700;font-size:clamp(28px,4vw,44px);line-height:1.15}
h2{font-weight:600;font-size:24px;line-height:1.2}
p{margin:0}
.lead{color:var(--muted);font-size:clamp(17px,1.8vw,22px);max-width:60ch}
.lead strong{color:var(--text)}
.eyebrow{font:600 13px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-top:8px}
.head>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.clock .t{font:700 clamp(44px,7vw,84px)/1 var(--f-board);font-variant-numeric:tabular-nums;color:var(--hi)}
.clock .l{color:var(--muted);font-size:16px}

/* Palabras */
.board{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
.board li{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px;height:clamp(150px,20vh,210px);overflow:hidden;min-width:0}
.n{flex:none;font:700 18px/1 var(--f-board);color:var(--badge-fg);background:var(--badge-bg);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.board .w{flex:1;min-height:0;width:100%;display:flex;align-items:center;font-weight:700;font-family:var(--f-board);line-height:1.1;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none;transition:filter .5s,opacity .5s}
.board.hidden .w{filter:blur(14px);opacity:.35;user-select:none}
.board.hidden li::after{content:"?";position:absolute;right:22px;bottom:12px;font:700 60px/1 var(--f-board);color:var(--raised)}
.callout{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px 22px 32px;position:relative;overflow:hidden}
.callout::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--aurora)}
.callout p{font-size:18px;max-width:70ch}
.callout.go{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.callout.go::before{display:none}
.callout.go h2{font-size:clamp(26px,3vw,36px)}

/* Formularios */
form{display:flex;flex-direction:column;gap:22px;max-width:880px}
label{font:600 15px/1.2 var(--f-ui);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
input[type=text],input[type=time],input[type=number],select{font:500 20px/1.2 var(--f-board);color:var(--text);background:var(--surface);border:1px solid var(--input-line);border-radius:12px;padding:14px 16px;width:100%;min-width:0}
input::placeholder{color:var(--dim)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.slot{display:flex;align-items:center;gap:10px;min-width:0}
.slot .n{width:34px;height:34px;font-size:16px;background:var(--raised);color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note{color:var(--dim);font-size:15px}
.closed{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px;display:flex;flex-direction:column;gap:14px;max-width:720px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 16px;align-items:end;max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.entry label{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--text)}
.entry input[type=text]{height:60px}
.entry .btn.big{height:60px;padding-block:0;white-space:nowrap}
.entry.duo{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);max-width:960px}
.entry.duo .btn{grid-column:1/-1;justify-self:start}
.pdot{width:12px;height:12px;border-radius:50%;flex:none}.pdot.d1{background:var(--p1)}.pdot.d2{background:var(--p2)}
.lbl{font:600 15px/1.2 var(--f-ui);color:var(--muted)}
.timing{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:18px}
.timing .grid2{align-items:end}
.timing h3{margin:0;font:600 17px/1.2 var(--f-brand)}
.total{font:700 30px/1.2 var(--f-board);color:var(--hi);font-variant-numeric:tabular-nums;padding-block:10px}
.tl{position:relative;display:flex;height:34px;border-radius:10px;overflow:hidden;font:600 13px/34px var(--f-ui)}
.tl .seg{min-width:0;padding-inline:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .a{background:var(--lime);color:var(--on-lime)}.tl .b{background:var(--raised);color:var(--text)}
.tl .mark{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--btn);box-shadow:0 0 0 2px var(--surface)}

/* Resultado */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font:800 clamp(64px,10vw,120px)/1 var(--f-brand);font-variant-numeric:tabular-nums;background:var(--score-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.score .of{font:600 28px/1 var(--f-brand);color:var(--muted)}
.cmp{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.cmp li{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface);min-width:0}
.cmp .row{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--f-ui);letter-spacing:.04em;text-transform:uppercase}
.cmp .ans{font-weight:700;font-family:var(--f-board);line-height:1.2;white-space:nowrap;overflow:hidden}
.cmp .real{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.cmp li.ok{border-color:var(--ok)} .cmp li.ok .row{color:var(--ok)}
.cmp li.half{border-color:var(--half)} .cmp li.half .row{color:var(--half)}
.cmp li.miss .row,.cmp li.miss .ans{color:var(--dim)}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.aurora-msg{color:var(--muted);font-size:17px;max-width:62ch;border-top:1px solid var(--line);padding-top:18px}
.aurora-msg strong{color:var(--text)}

/* Parejas */
.memo{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(8px,1.4vw,16px);width:100%;max-width:calc(var(--cols) * 150px);margin-inline:auto}
@media (max-width:520px){.memo{--cols:4 !important}}
.card{aspect-ratio:1;max-width:100%;perspective:800px;border:0;padding:0;background:none;cursor:pointer;border-radius:16px}
.card .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.card .face,.card .back{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.card .back{background:var(--aurora);box-shadow:inset 0 0 0 1px rgba(11,16,38,.15)}
.card .back::after{content:"";width:28%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(11,16,38,.25)}
.card .face{background:var(--card-face);transform:rotateY(180deg)}
.card .face svg{width:66%;height:66%}
.card.done .face{box-shadow:inset 0 0 0 3px var(--lime)}
.card.done{cursor:default}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font:700 34px/1 var(--f-board);font-variant-numeric:tabular-nums;color:var(--hi)}
.stat span{color:var(--muted);font-size:14px}

/* Secuencia */
.simonwrap{display:flex;flex-direction:column;align-items:center;gap:20px}
.simon{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,18px);width:min(100%,520px,62vh);aspect-ratio:1}
.pad{border:0;border-radius:28px;cursor:pointer;opacity:.4;transition:opacity .12s,transform .12s,box-shadow .12s;box-shadow:inset 0 0 0 2px rgba(11,16,38,.15)}
.pad:nth-child(1){background:#A884FF;border-top-left-radius:50%}
.pad:nth-child(2){background:#E5F06F;border-top-right-radius:50%}
.pad:nth-child(3){background:#F5A6D3;border-bottom-left-radius:50%}
.pad:nth-child(4){background:#8EB8FF;border-bottom-right-radius:50%}
.pad.lit{opacity:1;transform:scale(1.03);box-shadow:0 0 40px 6px currentColor}
.pad:nth-child(1).lit{color:#A884FF}.pad:nth-child(2).lit{color:#E5F06F}.pad:nth-child(3).lit{color:#F5A6D3}.pad:nth-child(4).lit{color:#8EB8FF}
.simon.lock .pad{cursor:default}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none;box-shadow:0 0 0 8px var(--bg)}
.hub b{font:700 clamp(34px,6vw,56px)/1 var(--f-board);font-variant-numeric:tabular-nums}
.hub span{font-size:13px;color:var(--muted)}
.sstatus{font:600 clamp(20px,2.4vw,28px)/1.2 var(--f-brand);text-align:center;min-height:1.2em}

/* Duelo */
.vs{font:800 22px/60px var(--f-brand);color:var(--muted);text-align:center}
.p1in{border-color:var(--p1)!important;border-width:2px!important}.p2in{border-color:var(--p2)!important;border-width:2px!important}
.duelbar{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pl{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;gap:2px 12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 20px;min-width:0;transition:border-color .2s,background .2s}
.pl .pn{font:700 clamp(20px,2.4vw,30px)/1.15 var(--f-board);overflow-wrap:anywhere;min-width:0}
.pl b{grid-row:span 2;font:800 clamp(40px,6vw,64px)/1 var(--f-brand);font-variant-numeric:tabular-nums}
.pl .turn{font:600 13px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;visibility:hidden}
.pl.p1 b{color:var(--p1)} .pl.p2 b{color:var(--p2)}
.pl.p1.on{border-color:var(--p1);background:var(--raised)} .pl.p2.on{border-color:var(--p2);background:var(--raised)}
.pl.on .turn{visibility:visible} .pl.p1 .turn{color:var(--p1)} .pl.p2 .turn{color:var(--p2)}
.card.o0 .face{box-shadow:inset 0 0 0 4px #A884FF}.card.o1 .face{box-shadow:inset 0 0 0 4px #E5F06F}
.rank li.match{grid-template-columns:1fr auto 1fr}
.rank li.match:first-child{background:var(--surface);border-color:var(--line)}
.rank .r{text-align:right}
/* QR */
.head>div:first-child{flex:1 1 380px}
.head>.side{flex:none;display:flex;flex-direction:row;gap:24px;align-items:center;flex-wrap:nowrap}
@media (max-width:700px){.head>.side{flex-wrap:wrap}}
.qr{background:#FFFFFF;border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;width:164px;box-shadow:0 0 0 1px var(--line)}
.qrimg{width:144px;height:144px}.qrimg svg{width:100%;height:100%;display:block}
.qr p{margin:0;color:#0B1026;font:600 13px/1.25 var(--f-ui);text-align:center}
.qrprev{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.qrprev .field{flex:1 1 260px}
.link{color:var(--accent);overflow-wrap:anywhere;font-size:14px}
/* Timer celular */
body.timer nav{display:none}
.tview{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-block:4vh;max-width:560px;margin-inline:auto;width:100%}
.tbig{font:700 clamp(72px,24vw,150px)/1 var(--f-board);font-variant-numeric:tabular-nums;color:var(--hi)}
.tbar{width:100%;height:12px;border-radius:999px;background:var(--raised);overflow:hidden}.tbar span{display:block;height:100%;background:var(--aurora);width:0}
/* Ranking */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-width:820px}
.rank li{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.rank .pos{font:700 22px/1 var(--f-board);color:var(--muted);font-variant-numeric:tabular-nums}
.rank li:first-child{background:var(--raised);border-color:var(--hi)}
.rank li:first-child .pos{color:var(--hi)}
.rank .name{font:700 22px/1.2 var(--f-board);min-width:0;overflow-wrap:anywhere}
.rank .pts{font:700 22px/1 var(--f-board);font-variant-numeric:tabular-nums;text-align:right}
.rank .pts small{font:500 14px var(--f-ui);color:var(--dim)}
.empty{color:var(--dim);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:820px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:32px}
.cols>section{display:flex;flex-direction:column;gap:14px;min-width:0}

/* Staff */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:18px;max-width:880px}
.panel h2{font-size:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.status{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--f-ui);padding:8px 12px;border-radius:999px;background:var(--raised)}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.status.off .dot{background:var(--accent)}
.check{display:flex;align-items:center;gap:10px;font:500 16px var(--f-ui);color:var(--text)}
.check input{width:22px;height:22px;accent-color:var(--btn)}
.danger{color:var(--danger);border-color:var(--danger-line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lime);color:var(--on-lime);font:600 16px var(--f-ui);padding:12px 20px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:700px){
  header{padding-block:14px}
  nav{width:100%}
  nav button{padding:10px 12px;font-size:14px}
  .head{align-items:flex-start}
  .clock{align-items:flex-start;text-align:left}
  .btn.big{font-size:18px;padding:16px 22px}
  .callout{padding:18px 18px 18px 24px}
  .panel,.closed{padding:18px}
  .board{grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
  .board li{height:120px;padding:14px 16px;gap:8px}
  .board .n{width:30px;height:30px;font-size:15px}
  .entry,.entry.duo{grid-template-columns:minmax(0,1fr);padding:18px}
  .entry .btn.big{justify-self:stretch}
  .vs{line-height:1}
  .duelbar{gap:8px}
  .pl{padding:12px 14px}
  .stats{gap:18px}
  .rank li{grid-template-columns:32px 1fr auto;padding:12px 14px;gap:10px}
  .rank .name,.rank .pts{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>

<div class="band"></div>
<div class="wrap">
  <header>
    <div class="brand"><span class="wordmark">AURORA</span><span class="tag">Juegos de memoria</span></div>
    <nav aria-label="Secciones">
      <button data-go="board">Palabras</button>
      <button data-go="pairs">Parejas</button>
      <button data-go="simon">Secuencia</button>
      <button data-go="duel">Duelo</button>
      <button data-go="rank">Ranking</button>
      <button data-go="staff" class="ghost">Staff</button>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status"></div>

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];

function score(ans){
  const used=new Set();let pos=0,rec=0;
  const detail=ans.map((a,i)=>{if(same(a,S.words[i])){pos++;rec++;used.add(i);return"ok"}return null});

}

function answer(){
  if(lastResult) return result();
  if(phase()==="end") return`<section class="view"><div class="closed"><span class="eyebrow">Palabras · Ronda ${S.round}</span><h2>Se terminó el tiempo para responder</h2><p class="lead">Esperá la próxima ronda y volvé a intentarlo.</p><div class="actions"><button class="btn primary" data-go="board">Ir al pizarrón</button></div></div></section>`;
  if(!isChallenge()) return`<section class="view"><div class="closed"><span class="eyebrow">Palabras · Ronda ${S.round}</span><h2>Todavía no es la hora del desafío</h2><p class="lead">Las respuestas se abren a las <strong>${hhmm(S.challengeAt)}</strong>. Mientras tanto, mirá bien el pizarrón.</p><div class="actions"><button class="btn primary" data-go="board">Ir al pizarrón</button></div></div></section>`;
  return`<section class="view"><div><span class="eyebrow">Palabras · Ronda ${S.round}</span><h1>¿Qué palabras eran?</h1></div>
  <form id="f" autocomplete="off">
    <div class="field"><label for="name">Tu nombre</label><input type="text" id="name" maxlength="28" placeholder="Ej: Martina" required></div>
    <div class="field"><label>Escribí cada palabra en el lugar donde estaba. Si no te acordás de alguna, dejala vacía.</label>
      <div class="slots">${Array.from({length:N()},(_,i)=>`<div class="slot"><span class="n">${i+1}</span><input type="text" id="w${i}" aria-label="Palabra ${i+1}" placeholder="Palabra ${i+1}"></div>`).join("")}</div></div>
    <div class="actions"><button class="btn lime big" type="submit">Ver mi puntaje</button><span class="note">No importan tildes ni mayúsculas.</span></div>
  </form></section>`;
}
function result(){
  const r=lastResult,d=r.score.detail;
  const labels={ok:"✓ Palabra y lugar",half:"Palabra sí, lugar no",miss:"No coincide"};
  const q=r.score.points/(N()*2);const msg=q>=.85?"¡Memoria brillante!":q>=.55?"¡Muy bien!":q>=.25?"¡Buen intento!":"¡Gracias por jugar!";
  return`<section class="view">
    <div><span class="eyebrow">${esc(r.name)} · Palabras · Ronda ${S.round}</span><h1>${msg}</h1></div>
    <div class="score"><span class="big">${r.score.points}</span><span class="of">de ${N()*2} puntos</span></div>
    <div class="legend"><span>${r.score.rec} palabras recordadas</span><span>${r.score.pos} en su lugar</span></div>
    <ol class="cmp">${S.words.map((w,i)=>`<li class="${d[i]}"><span class="row">${i+1} · ${labels[d[i]]}</span><span class="ans fit" data-max="22" data-min="13">${esc(r.ans[i]||"—")}</span><span class="real">Era: ${esc(w)}</span></li>`).join("")}</ol>
    <p class="aurora-msg">Recordar una lista unos minutos ya cuesta. Para una persona con Alzheimer, lo difícil es recordar la pastilla de las 8 o dónde quedaron las llaves. <strong>Aurora es un asistente de voz que recuerda esas cosas por ella</strong> y acompaña a quien la cuida.</p>
    <div class="actions"><button class="btn primary big" id="next">Siguiente jugador</button><button class="btn" data-go="rank">Ver ranking</button></div>
  </section>`;
}

/* ---------- Parejas ---------- */
let P={phase:"name"};
function pairsCols(n){const c=n*2;return c<=16?4:c<=20?5:6}
function pairsView(){
  const n=S.pairsN;
  if(P.phase==="name") return`<section class="view">
    <div class="head"><div><span class="eyebrow">Parejas</span><h1>Mirá las figuras, después encontrá los pares</h1>
    <p class="lead">Vas a ver las ${n*2} cartas durante <strong>${S.preview} segundos</strong>. Después se dan vuelta y tenés que dar vuelta de a dos hasta encontrar cada pareja. Gana quien lo logra en menos intentos.</p></div></div>
    <form id="pf" class="entry" autocomplete="off"><div class="field"><label for="pname">Tu nombre</label><input type="text" id="pname" maxlength="28" placeholder="Ej: Joaquín" required></div><button class="btn lime big" type="submit">Empezar</button></form>
  </section>`;
  if(P.phase==="done"){
    const pos=sortPairs(S.pairs).findIndex(e=>e.at===P.at)+1;
    const msg=P.attempts<=n+1?"¡Memoria fotográfica!":P.attempts<=n*1.6?"¡Muy bien!":"¡Lo lograste!";
    return`<section class="view"><div><span class="eyebrow">${esc(P.name)} · Parejas</span><h1>${msg}</h1></div>
    <div class="score"><span class="big">${P.attempts}</span><span class="of">intentos para ${n} pares</span></div>
    <div class="legend"><span>${P.secs} segundos</span><span>Puesto ${pos} en el ranking</span></div>
    <p class="aurora-msg">Asociar una cara con un nombre o un objeto con su lugar es de lo que más cuesta con el Alzheimer. <strong>Aurora acompaña con recordatorios por voz y fotos de la familia</strong>, para que el día a día sea más fácil.</p>
    <div class="actions"><button class="btn primary big" id="pagain">Siguiente jugador</button><button class="btn" id="torankP">Ver ranking</button></div></section>`;
  }
  return`<section class="view">
    <div class="head"><div><span class="eyebrow">Parejas · ${esc(P.name)}</span><h1 id="ptitle">${P.phase==="preview"?"Memorizá dónde está cada figura":"Encontrá los pares"}</h1></div>
    <div class="stats">${P.phase==="preview"?`<div class="stat"><b id="pcd">${P.left}</b><span>segundos</span></div>`:`<div class="stat"><b id="patt">${P.attempts}</b><span>intentos</span></div><div class="stat"><b id="pfound">${P.found}/${n}</b><span>pares</span></div>`}</div></div>
    <div class="memo" style="--cols:${pairsCols(n)}" id="memo">${P.deck.map((s,i)=>`<button class="card${P.phase==="preview"||P.open.includes(i)||P.done.has(i)?" up":""}${P.done.has(i)?" done":""}" data-i="${i}" aria-label="${P.phase==="preview"||P.open.includes(i)||P.done.has(i)?SHAPES[s][0]:"Carta "+(i+1)}"><span class="in"><span class="back"></span><span class="face">${svg(s)}</span></span></button>`).join("")}</div>
  </section>`;
}
function startPairs(name){
  const n=S.pairsN, ids=shuffle(SHAPES.map((_,i)=>i)).slice(0,n);
  P={phase:"preview",name,deck:shuffle([...ids,...ids]),open:[],done:new Set(),attempts:0,found:0,left:S.preview,lock:true,t0:0,timers:[]};
  render();
  const tick=setInterval(()=>{P.left--;const el=$("#pcd");if(el)el.textContent=P.left;if(P.left<=0){clearInterval(tick);P.phase="play";P.lock=false;P.t0=Date.now();render()}},1000);
  P.timers.push(()=>clearInterval(tick));
}
function flip(i){
  if(P.phase!=="play"||P.lock||P.done.has(i)||P.open.includes(i))return;
  P.open.push(i);setCard(i,true);
  if(P.open.length<2)return;
  P.attempts++;$("#patt").textContent=P.attempts;
  const [a,b]=P.open;
  if(P.deck[a]===P.deck[b]){
    P.done.add(a);P.done.add(b);P.open=[];P.found++;$("#pfound").textContent=P.found+"/"+S.pairsN;
    [a,b].forEach(k=>app.querySelector(`.card[data-i="${k}"]`)?.classList.add("done"));
    if(P.found===S.pairsN){P.secs=Math.round((Date.now()-P.t0)/1000);P.at=Date.now();
      S.pairs.push({name:P.name,pairs:S.pairsN,attempts:P.attempts,secs:P.secs,at:P.at});save();
      const t=setTimeout(()=>{P.phase="done";render()},900);P.timers.push(()=>clearTimeout(t))}
  }else{
    P.lock=true;const t=setTimeout(()=>{setCard(a,false);setCard(b,false);P.open=[];P.lock=false},950);P.timers.push(()=>clearTimeout(t));
  }
}
function setCard(i,up){const c=app.querySelector(`.card[data-i="${i}"]`);if(!c)return;c.classList.toggle("up",up);c.setAttribute("aria-label",up?SHAPES[P.deck[i]][0]:"Carta "+(i+1))}
const sortPairs=a=>[...a].sort((x,y)=>(x.attempts/x.pairs)-(y.attempts/y.pairs)||y.pairs-x.pairs||x.secs-y.secs);

/* ---------- Secuencia ---------- */
let Q={phase:"name"}, actx=null;
const TONES=[329.6,392,440,523.3];
function beep(i,ms){if(!S.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=i<0?150:TONES[i];g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.2,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+ms/1000);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+ms/1000+.05)}catch(e){}}
function simonView(){
  if(Q.phase==="name") return`<section class="view">
    <div class="head"><div><span class="eyebrow">Secuencia</span><h1>Repetí la secuencia de luces</h1>
    <p class="lead">Como el anillo de luz de Aurora Home: se van a encender colores en un orden. Tocalos en el mismo orden. Cada vez que acertás, la secuencia suma un color más.</p></div></div>
    <form id="sf" class="entry" autocomplete="off"><div class="field"><label for="sname">Tu nombre</label><input type="text" id="sname" maxlength="28" placeholder="Ej: Sofía" required></div><button class="btn lime big" type="submit">Empezar</button></form>
  </section>`;
  if(Q.phase==="done"){
    const pos=sortSimon(S.simon).findIndex(e=>e.at===Q.at)+1, lv=Q.level;
    const msg=lv>=10?"¡Memoria de acero!":lv>=6?"¡Muy bien!":lv>=3?"¡Buen intento!":"¡Gracias por jugar!";
    return`<section class="view"><div><span class="eyebrow">${esc(Q.name)} · Secuencia</span><h1>${msg}</h1></div>
    <div class="score"><span class="big">${lv}</span><span class="of">${lv===1?"color recordado":"colores recordados seguidos"}</span></div>
    <div class="legend"><span>Puesto ${pos} en el ranking</span></div>
    <p class="aurora-msg">La memoria de corto plazo suele ser de lo primero que se afecta con el Alzheimer. <strong>Aurora guía las rutinas paso a paso por voz</strong>, con luces que indican cuándo escucha y cuándo hay un recordatorio.</p>
    <div class="actions"><button class="btn primary big" id="sagain">Siguiente jugador</button><button class="btn" id="torankS">Ver ranking</button></div></section>`;
  }
  return`<section class="view"><div class="head"><div><span class="eyebrow">Secuencia · ${esc(Q.name)}</span><h1>Repetí la secuencia</h1></div></div>
    <div class="simonwrap"><p class="sstatus" id="sst" aria-live="polite">Mirá con atención…</p>
    <div class="simon lock" id="simon">${["Violeta","Lima","Rosa","Celeste"].map((c,i)=>`<button class="pad" data-p="${i}" aria-label="${c}"></button>`).join("")}<div class="hub"><b id="slv">${Q.seq.length}</b><span>colores</span></div></div></div>
  </section>`;
}
function qTimer(fn,ms){const t=setTimeout(fn,ms);Q.timers.push(()=>clearTimeout(t))}
function lit(i,ms){const p=app.querySelector(`.pad[data-p="${i}"]`);if(!p)return;p.classList.add("lit");beep(i,ms);qTimer(()=>p.classList.remove("lit"),ms)}
function startSimon(name){Q={phase:"play",name,seq:[],idx:0,lock:true,timers:[]};render();qTimer(nextSimon,700)}
function nextSimon(){Q.seq.push(Math.floor(Math.random()*4));Q.idx=0;Q.lock=true;$("#slv").textContent=Q.seq.length;$("#simon").classList.add("lock");$("#sst").textContent="Mirá con atención…";
  const base=S.speed==="rapida"?420:620, on=Math.max(260,base-Q.seq.length*12), off=Math.round(on*.4);
  Q.seq.forEach((c,k)=>qTimer(()=>lit(c,on),k*(on+off)));
  qTimer(()=>{Q.lock=false;$("#simon").classList.remove("lock");$("#sst").textContent="¡Tu turno!"},Q.seq.length*(on+off));
}
function press(i){
  if(Q.phase!=="play"||Q.lock)return;
  if(i===Q.seq[Q.idx]){lit(i,220);Q.idx++;if(Q.idx===Q.seq.length){Q.lock=true;$("#sst").textContent="¡Bien!";qTimer(nextSimon,850)}}
  else{Q.lock=true;beep(-1,500);$("#sst").textContent="¡Uy! Era otro color";const p=app.querySelector(`.pad[data-p="${Q.seq[Q.idx]}"]`);p?.classList.add("lit");
    Q.level=Q.seq.length-1;Q.at=Date.now();S.simon.push({name:Q.name,level:Q.level,at:Q.at});save();qTimer(()=>{Q.phase="done";render()},1400)}
}
const sortSimon=a=>[...a].sort((x,y)=>y.level-x.level||x.at-y.at);
function stopGames(){[P,Q,D].forEach(g=>(g.timers||[]).forEach(f=>f()));if(P.phase!=="done")P={phase:"name"};if(Q.phase!=="done")Q={phase:"name"};if(D.phase!=="done")D={phase:"name"};P.timers=[];Q.timers=[];D.timers=[]}

/* ---------- Duelo ---------- */
let D={phase:"name"};
function duelView(){
  const n=S.duelN;
  if(D.phase==="name") return`<section class="view">
    <div class="head"><div><span class="eyebrow">Duelo · para 2 jugadores</span><h1>Memotest cara a cara</h1>
    <p class="lead">${S.duelPreview?`Miran las cartas juntos durante <strong>${S.duelPreview} segundos</strong>. Después, por`:"Por"} turnos, cada uno da vuelta dos cartas. Si encontrás un par, sumás un punto y seguís jugando. Si no, le toca al otro. Gana quien junte más pares.</p></div></div>
    <form id="df" autocomplete="off" class="entry duo">
      <div class="field"><label for="dn1"><span class="pdot d1"></span>Jugador 1</label><input type="text" id="dn1" class="p1in" maxlength="20" placeholder="Ej: Lucía" required></div>
      <span class="vs" aria-hidden="true">vs</span>
      <div class="field"><label for="dn2"><span class="pdot d2"></span>Jugador 2</label><input type="text" id="dn2" class="p2in" maxlength="20" placeholder="Ej: Tomás" required></div>
      <button class="btn lime big" type="submit">Empezar duelo</button>
    </form></section>`;
  if(D.phase==="done"){
    const [a,b]=D.score, w=a===b?-1:a>b?0:1;
    return`<section class="view"><div><span class="eyebrow">Duelo · ${n} pares</span><h1>${w<0?"¡Empate!":"¡Ganó "+esc(D.names[w])+"!"}</h1></div>
    <div class="duelbar">${[0,1].map(k=>`<div class="pl p${k+1}${w===k?" on":""}"><span class="pn">${esc(D.names[k])}</span><b>${D.score[k]}</b><span class="note">${D.score[k]===1?"par":"pares"}</span></div>`).join("")}</div>
    <p class="aurora-msg">Jugar y conversar con otros es parte de cuidar la memoria. <strong>Aurora también acompaña a la familia</strong>: el cuidador ve cómo está su ser querido y recibe avisos desde la app.</p>
    <div class="actions"><button class="btn primary big" id="drematch">Revancha</button><button class="btn" id="dnew">Nuevos jugadores</button><button class="btn" id="torankD">Ver ranking</button></div></section>`;
  }
  const up=i=>D.phase==="preview"||D.open.includes(i)||D.owner.has(i);
  return`<section class="view">
    <div class="duelbar">${[0,1].map(k=>`<div class="pl p${k+1}${D.phase==="play"&&D.turn===k?" on":""}" id="pl${k}"><span class="pn">${esc(D.names[k])}</span><b id="ds${k}">${D.score[k]}</b><span class="turn">Le toca</span></div>`).join("")}</div>
    <p class="sstatus" id="dst" aria-live="polite">${D.phase==="preview"?`Memoricen las cartas · <span id="dcd">${D.left}</span>`:"Turno de "+esc(D.names[D.turn])}</p>
    <div class="memo" style="--cols:${pairsCols(n)}">${D.deck.map((s,i)=>`<button class="card${up(i)?" up":""}${D.owner.has(i)?" done o"+D.owner.get(i):""}" data-d="${i}" aria-label="${up(i)?SHAPES[s][0]:"Carta "+(i+1)}"><span class="in"><span class="back"></span><span class="face">${svg(s)}</span></span></button>`).join("")}</div>
  </section>`;
}
function dTimer(fn,ms){const t=setTimeout(fn,ms);D.timers.push(()=>clearTimeout(t))}
function startDuel(names){
  const n=S.duelN, ids=shuffle(SHAPES.map((_,i)=>i)).slice(0,n);
  D={phase:S.duelPreview?"preview":"play",names,turn:Math.random()<.5?0:1,score:[0,0],deck:shuffle([...ids,...ids]),open:[],owner:new Map(),lock:!!S.duelPreview,left:S.duelPreview,timers:[]};
  render();
  if(S.duelPreview){const tick=setInterval(()=>{D.left--;const el=$("#dcd");if(el)el.textContent=D.left;if(D.left<=0){clearInterval(tick);D.phase="play";D.lock=false;render()}},1000);D.timers.push(()=>clearInterval(tick))}
}
function dSet(i,up){const c=app.querySelector(`.card[data-d="${i}"]`);if(!c)return;c.classList.toggle("up",up);c.setAttribute("aria-label",up?SHAPES[D.deck[i]][0]:"Carta "+(i+1))}
function dTurnUI(){[0,1].forEach(k=>$("#pl"+k)?.classList.toggle("on",D.turn===k));const st=$("#dst");if(st)st.textContent="Turno de "+D.names[D.turn]}
function dflip(i){
  if(D.phase!=="play"||D.lock||D.owner.has(i)||D.open.includes(i))return;
  D.open.push(i);dSet(i,true);if(D.open.length<2)return;
  const [a,b]=D.open;
  if(D.deck[a]===D.deck[b]){
    D.owner.set(a,D.turn);D.owner.set(b,D.turn);D.open=[];D.score[D.turn]++;$("#ds"+D.turn).textContent=D.score[D.turn];
    [a,b].forEach(k=>app.querySelector(`.card[data-d="${k}"]`)?.classList.add("done","o"+D.turn));
    $("#dst").textContent="¡Par para "+D.names[D.turn]+"! Sigue jugando";
    if(D.owner.size===D.deck.length){D.lock=true;D.at=Date.now();S.duels.push({a:D.names[0],b:D.names[1],sa:D.score[0],sb:D.score[1],pairs:S.duelN,at:D.at});save();dTimer(()=>{D.phase="done";render()},1000)}
  }else{D.lock=true;dTimer(()=>{dSet(a,false);dSet(b,false);D.open=[];D.turn=1-D.turn;D.lock=false;dTurnUI()},1000)}
}
function duelWins(){const m=new Map();S.duels.forEach(d=>{[[d.a,d.sa>d.sb],[d.b,d.sb>d.sa]].forEach(([nm,won])=>{const k=norm(nm)||nm;const e=m.get(k)||{name:nm,wins:0,games:0};e.games++;if(won)e.wins++;m.set(k,e)})});
  return[...m.values()].sort((x,y)=>y.wins-x.wins||x.games-y.games)}

/* ---------- Ranking ---------- */
function rows(list,fmt){
  if(!list.length) return`<p class="empty">Todavía no hay resultados.</p>`;
  return`<ol class="rank">${list.slice(0,10).map((e,i)=>`<li><span class="pos">${i+1}</span><span class="name">${esc(e.name)}</span><span class="pts">${fmt(e)}</span></li>`).join("")}</ol>`;
}
const sortE=a=>[...a].sort((x,y)=>y.points-x.points||x.at-y.at);
function rank(){
  const tab=(k,l)=>`<button class="btn" data-tab="${k}" aria-pressed="${rankTab===k}">${l}</button>`;
  let body="";
  if(rankTab==="words"){const f=e=>`${e.points} <small>/ ${e.max||14} pts</small>`;
    body=`<div class="cols"><section><h2>Ronda ${S.round}</h2>${rows(sortE(S.entries.filter(e=>e.round===S.round)),f)}</section><section><h2>Toda la expo</h2>${rows(sortE(S.entries),f)}</section></div>`}
  else if(rankTab==="pairs") body=`<section class="cols"><section><h2>Menos intentos por par</h2>${rows(sortPairs(S.pairs),e=>`${e.attempts} <small>intentos · ${e.pairs} pares · ${e.secs} s</small>`)}</section></section>`;
  else if(rankTab==="duels"){const recent=[...S.duels].sort((x,y)=>y.at-x.at).slice(0,10);
    body=`<div class="cols"><section><h2>Más victorias</h2>${rows(duelWins(),e=>`${e.wins} <small>${e.wins===1?"victoria":"victorias"} · ${e.games} ${e.games===1?"duelo":"duelos"}</small>`)}</section>
    <section><h2>Últimos duelos</h2>${recent.length?`<ol class="rank">${recent.map(d=>`<li class="match"><span class="name">${esc(d.a)}</span><span class="pts">${d.sa} – ${d.sb}</span><span class="name r">${esc(d.b)}</span></li>`).join("")}</ol>`:`<p class="empty">Todavía no hay duelos.</p>`}</section></div>`}
  else body=`<section class="cols"><section><h2>Secuencia más larga</h2>${rows(sortSimon(S.simon),e=>`${e.level} <small>colores</small>`)}</section></section>`;
  return`<section class="view"><div><span class="eyebrow">Ranking</span><h1>Las mejores memorias del stand</h1></div>
  <div class="tabs">${tab("words","Palabras")}${tab("pairs","Parejas")}${tab("simon","Secuencia")}${tab("duels","Duelo")}</div>${body}</section>`;
}

/* ---------- Staff ---------- */
function staff(){
  const ch=isChallenge(), t=new Date(S.challengeAt), tv=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
  const opt=(v,cur,l)=>`<option value="${v}"${String(v)===String(cur)?" selected":""}>${l}</option>`;
  return`<section class="view"><div><span class="eyebrow">Solo para el equipo</span><h1>Configuración</h1></div>
  <div class="panel"><h2>Apariencia</h2><div class="actions">
    <button class="btn" data-theme-set="dark" aria-pressed="${S.theme==="dark"}">Modo oscuro</button>
    <button class="btn" data-theme-set="light" aria-pressed="${S.theme==="light"}">Modo claro</button>
    <button class="btn" id="fs">Pantalla completa</button></div>
    <div class="actions"><span class="lbl">Zoom</span><button class="btn" id="zm" aria-label="Achicar">−</button><button class="btn" id="z0">${Math.round(S.zoom*100)}%</button><button class="btn" id="zp" aria-label="Agrandar">+</button><span class="note">También con Ctrl + rueda del mouse, o Ctrl + / Ctrl −.</span></div>
    <p class="note">El modo oscuro es el de la marca; el claro se lee mejor si el stand tiene mucha luz.</p></div>
  <div class="panel"><div class="actions" style="justify-content:space-between"><h2>Palabras · Ronda ${S.round}</h2>
    <span class="status ${ch?"":"off"}"><span class="dot"></span>${({mem:"Palabras en pantalla hasta las "+hhmm(S.challengeAt),ans:"Respuestas abiertas hasta las "+hhmm(endAt()),end:"Ronda terminada"})[phase()]}</span></div>
    <div class="grid2">${S.words.map((w,i)=>`<div class="field"><label for="e${i}">Palabra ${i+1}</label><input type="text" id="e${i}" value="${esc(w)}"></div>`).join("")}
      <div class="field"><label for="cant">Cantidad de palabras</label><input type="number" id="cant" min="1" max="${MAXW}" value="${N()}"></div>
      </div>
    <div class="timing"><h3>Tiempos de la ronda</h3>
      <div class="grid2">
        <div class="field"><label for="rmin">Palabras en pantalla (minutos)</label><input type="number" id="rmin" min="0.5" max="600" step="0.5" value="${S.roundMin}"></div>
        <div class="field"><label for="amin">Palabras ocultas, para responder (minutos)</label><input type="number" id="amin" min="0.5" max="600" step="0.5" value="${S.answerMin}"></div>
        <div class="field"><span class="lbl">Duración total de la ronda</span><span class="total" id="tot">${fmtMin(S.roundMin+S.answerMin)}</span></div></div>
      <div class="tl" aria-hidden="true"><span class="seg a" style="flex:${S.roundMin}">En pantalla</span><span class="seg b" style="flex:${S.answerMin}">Ocultas</span><span class="mark" id="tlm" style="left:${progress()}%"></span></div>
      <p class="note">Ronda ${S.round}: empezó a las ${hhmm(S.roundStart)}, se ocultan a las ${hhmm(S.challengeAt)} y a las ${hhmm(endAt())} arranca sola la ronda ${S.round+1}. Los cambios de tiempo se aplican a la ronda actual.</p></div>
    <div class="actions"><button class="btn primary" id="saveW">Guardar cambios</button><button class="btn" id="shuffle">Sortear palabras nuevas</button>
      <button class="btn" id="toggle">${ch?"Volver a mostrar (reinicia el tiempo)":"Ocultar palabras ahora"}</button></div>
    <div class="actions"><button class="btn lime" id="newR">Empezar ronda ${S.round+1}</button><span class="note">Corta la ronda actual y arranca otra ahora, con ${N()} palabras nuevas.</span></div>
  </div>
  <div class="panel"><h2>QR para celulares</h2>
    <div class="field"><label for="purl">Dirección pública del juego</label><input type="text" id="purl" placeholder="https://tu-usuario.github.io/aurora-juegos/" value="${esc(S.publicUrl)}"></div>
    ${playerUrl()?`<div class="qrprev">${qrBlock()}<div class="field"><span class="lbl">El QR de la ronda ${S.round} abre:</span><a class="link" href="${esc(playerUrl())}" target="_blank" rel="noopener">${esc(playerUrl())}</a><span class="note">El QR cambia solo con cada ronda. Si cambiás los tiempos o empezás una ronda a mano, los celulares que ya lo escanearon quedan desfasados: que lo vuelvan a escanear.</span></div></div>`
      :`<p class="note">Para que aparezca el QR al lado de las palabras, el juego tiene que estar publicado en una dirección web que los celulares puedan abrir (por ejemplo, GitHub Pages). Pegá esa dirección acá.</p>`}
  </div>
  <div class="panel"><h2>Parejas</h2><div class="grid2">
    <div class="field"><label for="pn">Cantidad de pares</label><select id="pn">${[3,4,5,6,8,10,12].map(v=>opt(v,S.pairsN,v+" pares ("+v*2+" cartas)")).join("")}</select></div>
    <div class="field"><label for="pv">Segundos para memorizar</label><input type="number" id="pv" min="1" max="60" value="${S.preview}"></div></div></div>
  <div class="panel"><h2>Secuencia</h2><div class="grid2">
    <div class="field"><label for="sp">Velocidad</label><select id="sp">${opt("normal",S.speed,"Normal")}${opt("rapida",S.speed,"Rápida")}</select></div>
    <label class="check"><input type="checkbox" id="snd"${S.sound?" checked":""}> Sonido al encender cada color</label></div></div>
  <div class="panel"><h2>Duelo</h2><div class="grid2">
    <div class="field"><label for="dn">Cantidad de pares</label><input type="number" id="dn" min="3" max="12" value="${S.duelN}"></div>
    <div class="field"><label for="dp">Segundos para memorizar (0 = sin vista previa)</label><input type="number" id="dp" min="0" max="30" value="${S.duelPreview}"></div></div></div>
  <div class="panel"><h2>Borrar rankings</h2><p class="note">Tocá dos veces para confirmar.</p><div class="actions">
    ${[["entries","Palabras"],["pairs","Parejas"],["simon","Secuencia"],["duels","Duelo"]].map(([k,l])=>`<button class="btn danger" data-clear="${k}">${confirmClear===k?"Confirmar: borrar "+S[k].length:"Borrar "+l+" ("+S[k].length+")"}</button>`).join("")}</div></div>
  <div class="panel"><h2>Reiniciar todo</h2><p class="note">Borra los resultados de todos los juegos y vuelve a la ronda 1. Se mantiene la configuración. Los datos se guardan solo en este navegador.</p>
    <div class="actions">${confirmReset?`<span>¿Seguro? Se borran ${S.entries.length+S.pairs.length+S.simon.length+S.duels.length} resultados.</span><button class="btn danger" id="resetY">Sí, borrar todo</button><button class="btn" id="resetN">Cancelar</button>`:`<button class="btn danger" id="reset">Reiniciar juego</button>`}</div></div>
  </section>`;
}

function bind(){
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const on=(id,fn,ev="onclick")=>{const el=$("#"+id);if(el)el[ev]=fn};
  const f=$("#f");
  if(f){$("#name").focus();f.onsubmit=e=>{e.preventDefault();const name=$("#name").value.trim();if(!name){$("#name").focus();return}
    const ans=Array.from({length:N()},(_,i)=>$("#w"+i).value.trim());const sc=score(ans);
    S.entries.push({name,round:S.round,points:sc.points,max:N()*2,ans,at:Date.now()});save();lastResult={name,ans,score:sc};render();window.scrollTo(0,0)}}
  on("next",()=>{lastResult=null;render()});
  // Parejas
  on("pf",e=>{e.preventDefault();const n=$("#pname").value.trim();if(n)startPairs(n)},"onsubmit");
  $("#pname")?.focus();
  app.querySelectorAll(".card[data-i]").forEach(c=>c.onclick=()=>flip(+c.dataset.i));
  on("pagain",()=>{P={phase:"name"};render()});
  on("torankP",()=>{rankTab="pairs";P={phase:"name"};go("rank")});
  // Secuencia
  on("sf",e=>{e.preventDefault();const n=$("#sname").value.trim();if(n){beep(0,1);startSimon(n)}},"onsubmit");
  $("#sname")?.focus();
  app.querySelectorAll(".pad").forEach(p=>p.onclick=()=>press(+p.dataset.p));
  on("sagain",()=>{Q={phase:"name"};render()});
  on("torankS",()=>{rankTab="simon";Q={phase:"name"};go("rank")});
  // Duelo
  on("df",e=>{e.preventDefault();const a=$("#dn1").value.trim(),b=$("#dn2").value.trim();if(a&&b)startDuel([a,b])},"onsubmit");
  $("#dn1")?.focus();
  app.querySelectorAll(".card[data-d]").forEach(c=>c.onclick=()=>dflip(+c.dataset.d));
  on("drematch",()=>startDuel([D.names[1],D.names[0]]));
  on("dnew",()=>{D={phase:"name"};render()});
  on("torankD",()=>{rankTab="duels";D={phase:"name"};go("rank")});
  // Ranking
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{rankTab=b.dataset.tab;render()});
  // Staff
  app.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{S.theme=b.dataset.themeSet;save();applyTheme();render()});
  const cant=$("#cant");if(cant)cant.onchange=()=>{let n=Math.round(Number(cant.value));if(!n||n<1)n=1;if(n>MAXW)n=MAXW;
    const cur=Array.from({length:N()},(_,i)=>$("#e"+i).value.trim()||S.words[i]);
    S.words=n<=cur.length?cur.slice(0,n):cur.concat(pick(n-cur.length,cur));save();toast(n+(n===1?" palabra":" palabras")+" en esta ronda");render()};
  on("saveW",()=>{const w=Array.from({length:N()},(_,i)=>$("#e"+i).value.trim());if(w.some(x=>!x)){toast("Completá todas las palabras");return}
    S.words=w;save();toast("Cambios guardados");render()});
  on("shuffle",()=>{S.words=pick(N(),S.words);save();toast("Palabras nuevas sorteadas");render()});
  on("toggle",()=>{if(isChallenge()){S.roundStart=Date.now();S.challengeAt=S.roundStart+S.roundMin*60000}else S.challengeAt=Date.now();save();render()});
  on("newR",()=>{newRound();toast("Ronda "+S.round+" en marcha");go("board")});
  const num=(id,k,min,max)=>on(id,()=>{let v=Math.round(+$("#"+id).value);if(isNaN(v))v=CFG[k];S[k]=Math.min(max,Math.max(min,v));save();toast("Guardado");render()},"onchange");
  const mins=(id,k)=>{const el=$("#"+id);if(!el)return;
    el.oninput=()=>{const a=+$("#rmin").value||0,b=+$("#amin").value||0;$("#tot").textContent=fmtMin(a+b)};
    el.onchange=()=>{let v=Math.round((+el.value)*2)/2;if(!(v>=0.5))v=0.5;if(v>600)v=600;S[k]=v;S.challengeAt=S.roundStart+S.roundMin*60000;save();toast("Tiempos guardados · ronda de "+fmtMin(S.roundMin+S.answerMin));render()}};
  mins("rmin","roundMin");mins("amin","answerMin");num("dn","duelN",3,12);num("dp","duelPreview",0,30);
  app.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{const k=b.dataset.clear;if(confirmClear!==k){confirmClear=k;render();return}
    S[k]=[];confirmClear=null;save();toast("Ranking borrado");render()});
  on("pn",()=>{S.pairsN=+$("#pn").value;save();toast("Parejas: "+S.pairsN+" pares")},"onchange");
  on("pv",()=>{let v=Math.round(+$("#pv").value);S.preview=Math.min(60,Math.max(1,v||5));save();toast("Vista previa: "+S.preview+" s")},"onchange");
  on("sp",()=>{S.speed=$("#sp").value;save();toast("Velocidad guardada")},"onchange");
  on("snd",()=>{S.sound=$("#snd").checked;save()},"onchange");
  on("purl",()=>{S.publicUrl=$("#purl").value.trim();save();toast(S.publicUrl?"Dirección guardada":"Dirección borrada");render()},"onchange");
  on("zm",()=>setZoom(S.zoom-.1));on("zp",()=>setZoom(S.zoom+.1));on("z0",()=>setZoom(1));
  on("fs",()=>{document.documentElement.requestFullscreen?.().catch(()=>toast("Pantalla completa no disponible acá"))});
  on("reset",()=>{confirmReset=true;render()});
  on("resetN",()=>{confirmReset=false;render()});
  on("resetY",()=>{S=fresh(S);applyZoom();P={phase:"name"};Q={phase:"name"};D={phase:"name"};lastResult=null;save();applyTheme();confirmReset=false;toast("Todo reiniciado");go("board")});
}

/* ---------- Timer en el celular ---------- */
function startTimer(){
  document.body.classList.add("timer");document.documentElement.setAttribute("data-aurora","dark");
  const q=new URLSearchParams(location.hash.slice(1));
  const r0=+q.get("r")||1,s0=+q.get("s"),m=+q.get("m")||45,a=+q.get("a")||15;
  if(!s0){app.innerHTML=`<section class="tview"><h1>Este QR no es válido</h1><p class="lead">Volvé a escanear el código del stand de Aurora.</p></section>`;return}
  const per=(m+a)*60000;
  app.innerHTML=`<section class="tview">
    <span class="eyebrow" id="tr">Palabras</span>
    <h1 id="tt"></h1>
    <div class="tbig" id="tc">--:--</div>
    <div class="tbar"><span id="tf"></span></div>
    <p class="lead" id="tl"></p>
  </section>`;
  function tick(){
    const t=Date.now(),k=Math.max(0,Math.floor((t-s0)/per)),rs=s0+k*per,ch=rs+m*60000,en=ch+a*60000;
    let left,title,lead,frac;
    if(t<ch){left=ch-t;frac=(t-rs)/(ch-rs);title="Las palabras se ocultan en";
      lead=k>0?"Empezó una ronda nueva con otras palabras. Pasá por el stand a verlas.":"Memorizá las palabras del pizarrón y su orden.";}
    else{left=en-t;frac=(t-ch)/(en-ch);title="Tiempo para responder";lead="Andá al stand y decí qué palabras eran y en qué orden.";}
    $("#tr").textContent="Palabras · Ronda "+(r0+k);$("#tt").textContent=title;$("#tc").textContent=mmss(left);$("#tl").textContent=lead;
    $("#tf").style.width=(Math.min(1,Math.max(0,frac))*100).toFixed(1)+"%";document.title=mmss(left)+" · Aurora";
  }
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")tick()});
  tick();setInterval(tick,1000);
}

let wasPh=phase();
if(!IS_TIMER)setInterval(()=>{let ph=phase();
  if(ph==="end"){newRound();ph=phase();toast("Empezó la ronda "+S.round)}
  if(ph!==wasPh){wasPh=ph;if(view==="board"||(view==="answer"&&!lastResult)||view==="staff")render();return}
  const cd=$("#cd");if(cd)cd.textContent=left();const m=$("#tlm");if(m)m.style.left=progress()+"%"},1000);
try{navigator.wakeLock?.request("screen").catch(()=>{})}catch(e){}
applyZoom();
if(IS_TIMER)startTimer();else render();
</script>
